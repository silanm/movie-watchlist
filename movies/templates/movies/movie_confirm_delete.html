{% extends "movies/base.html" %}
{% block title %}Delete Movie{% endblock %}
{% block content %}
    <h2>Delete Movie</h2>
    <p>Are you sure you want to delete "{{ movie.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'movie_list' %}">No, Cancel</a>
    </form>
{% endblock %}
