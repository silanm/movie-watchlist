{% extends "movies/base.html" %}
{% block title %}Delete {{ movie.title }}{% endblock %}
{% block content %}
    <div class="form-rail">
        <h1>Delete movie</h1>
        <p>Delete “{{ movie.title }}”? This cannot be undone.</p>
        <form method="post" class="form-actions">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Delete</button>
            <a class="btn btn-ghost" href="{% url 'movie_list' %}">Cancel</a>
        </form>
    </div>
{% endblock %}
