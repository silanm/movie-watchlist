<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Movie Watchlist{% endblock %}</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"> -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'movies/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'movies/theme.css' %}">
</head>
<body>
    <header class="nav-edge">
        <a class="wordmark" href="{% url 'movie_list' %}">Movie Watchlist</a>
        <a class="btn btn-cta" href="{% url 'movie_create' %}">+ Add movie</a>
    </header>

    <main class="shell">
        {% if messages %}
            {% for message in messages %}
                <p class="flash{% if message.tags == 'error' %} flash-error{% endif %}" role="status">{{ message }}</p>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="foot-line">
        <p>Sila N Mahoot (st127124)</p>
    </footer>
</body>
</html>
