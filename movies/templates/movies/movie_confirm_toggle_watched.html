{% extends "movies/base.html" %}
{% block title %}Toggle watched{% endblock %}
{% block content %}
    <div class="form-rail">
        <h1>Update watched status</h1>
        <p>
            Mark “{{ movie.title }}” as
            {% if movie.watched %}unwatched{% else %}watched{% endif %}?
        </p>
        <form method="post" class="form-actions">
            {% csrf_token %}
            <button class="btn btn-cta" type="submit">
                {% if movie.watched %}Mark unwatched{% else %}Mark watched{% endif %}
            </button>
            <a class="btn btn-ghost" href="{% url 'movie_list' %}">Cancel</a>
        </form>
    </div>
{% endblock %}
